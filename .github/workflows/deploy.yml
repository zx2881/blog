name: Build and Deploy VitePress

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1. 为 GitHub Pages 打包并上传产物（带 /blog/ 子路径）
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for GitHub Pages
        run: npx vitepress build docs --base=/blog/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  # 2. 独立部署到 GitHub Pages（拆分 job 避免同 job 刚上传就查不到 artifact 的竞态）
  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 3. 独立为 Ubuntu VPS 打包并通过原生 OpenSSH 部署（根目录 /）
  deploy-vps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build for VPS
        run: npx vitepress build docs --base=/

      - name: Deploy to VPS via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          trap 'rm -f ~/.ssh/id_deploy' EXIT

          printf '%s\n' "$SERVER_SSH_KEY" | tr -d '\r' > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

          if ! ssh-keygen -y -P "" -f ~/.ssh/id_deploy > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY is not a valid passphrase-free SSH private key (check that you pasted the private key, not .pub, with full BEGIN/END lines)."
            exit 1
          fi

          HOST="$(printf '%s' "$SERVER_HOST" | tr -d '\r\n ')"
          USER_NAME="$(printf '%s' "$SERVER_USER" | tr -d '\r\n ')"
          if [ -z "$HOST" ] || [ -z "$USER_NAME" ]; then
            echo "::error::SERVER_HOST or SERVER_USER secret is empty."
            exit 1
          fi

          SSH_OPTS=(
            -i ~/.ssh/id_deploy
            -o BatchMode=yes
            -o StrictHostKeyChecking=no
            -o UserKnownHostsFile=/dev/null
            -o ConnectTimeout=30
            -o PubkeyAcceptedAlgorithms=+ssh-rsa
          )

          ssh "${SSH_OPTS[@]}" "${USER_NAME}@${HOST}" "mkdir -p /var/www/vitepress && find /var/www/vitepress -mindepth 1 -delete"
          tar -czf - -C docs/.vitepress/dist . | ssh "${SSH_OPTS[@]}" "${USER_NAME}@${HOST}" "tar -xzf - --no-same-owner --no-overwrite-dir -C /var/www/vitepress"
