name: Build and Deploy VitePress

on:
  push:
    branches:
      - main # 如果你的默认分支叫 master，请改成 master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Node.js 并启用 npm 缓存
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. 安装依赖并打包 VitePress
      - name: Install & Build
        run: |
          npm ci
          npm run docs:build

      # 4. 部署到 GitHub Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist # 如果你的文档在 docs 文件夹下，请改为 docs/.vitepress/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 5. 自动同步上传到你的 Ubuntu 服务器 Nginx 目录
      - name: Deploy to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docs/.vitepress/dist/*" # 若在 docs 下，改为 "docs/.vitepress/dist/*"
          target: "/var/www/vitepress/"
          strip_components: 3 # 若在 docs 下，改为 3
          rm: true
